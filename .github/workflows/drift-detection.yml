name: Drift Detection

on:
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    issues: write

env:
    AWS_REGION: us-east-1
    TF_VERSION: 1.5.7

jobs:
    detect-modules:
        name: Detect Modules
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
            has_modules: ${{ steps.set-matrix.outputs.has_modules }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Determine modules
              id: set-matrix
              run: |
                  MODULES=$(cat .github/terraform-modules.json)
                  AFFECTED=$(echo "$MODULES" | jq -c \
                    '[.modules[] | select(.ci_enabled == true)]')

                  if [ "$AFFECTED" == "[]" ]; then
                    echo "has_modules=false" >> $GITHUB_OUTPUT
                    echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
                  else
                    echo "has_modules=true" >> $GITHUB_OUTPUT
                    echo "matrix={\"include\":$AFFECTED}" >> $GITHUB_OUTPUT
                  fi

    drift-check:
        name: Drift - ${{ matrix.name }}
        needs: detect-modules
        if: needs.detect-modules.outputs.has_modules == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.detect-modules.outputs.matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Azure Login
              if: matrix.cloud == 'azure'
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Configure AWS Credentials
              if: matrix.cloud == 'aws'
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  role-session-name: GitHubActions
                  aws-region: ${{ env.AWS_REGION }}

            - name: Assume Terraform Role
              if: matrix.cloud == 'aws'
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
                  role-session-name: Terraform
                  aws-region: ${{ env.AWS_REGION }}
                  role-chaining: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Terraform Init
              working-directory: ${{ matrix.path }}
              env:
                  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  ARM_USE_OIDC: true
                  ARM_USE_AZUREAD: true
              run: terraform init

            - name: Terraform Plan
              id: plan
              working-directory: ${{ matrix.path }}
              env:
                  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  ARM_USE_OIDC: true
                  ARM_USE_AZUREAD: true
              run: |
                  set +e
                  terraform plan -detailed-exitcode -no-color -input=false \
                    -out=tfplan 2>&1 | tee plan_output.txt
                  echo "exitcode=$?" >> $GITHUB_OUTPUT

            - name: Open Issue on Drift
              if: steps.plan.outputs.exitcode == '2'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const plan = fs.readFileSync(
                        '${{ matrix.path }}/plan_output.txt', 'utf8'
                      );
                      const cloud = '${{ matrix.cloud }}' === 'azure' ? 'Azure' : 'AWS';

                      await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: `Drift detected: ${cloud} — ${{ matrix.name }}`,
                        body: `Drift detected in \`${{ matrix.name }}\` during weekly drift check.\n\n<details>\n<summary>Plan output</summary>\n\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\`\n</details>\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                        labels: ['drift', cloud.toLowerCase()]
                      });
