name: Terraform Apply

on:
    push:
        branches: [main]
        paths:
            - "terraform/**"

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: us-east-1
    TF_VERSION: 1.5.7

jobs:
    detect-changes:
        name: Detect Modules
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
            has_changes: ${{ steps.set-matrix.outputs.has_changes }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Determine modules
              id: set-matrix
              run: |
                  MODULES=$(cat .github/terraform-modules.json)
                  AFFECTED=$(echo "$MODULES" | jq -c \
                    '[.modules[] | select(.ci_enabled == true)]')

                  if [ "$AFFECTED" == "[]" ]; then
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                    echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
                  else
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                    echo "matrix={\"include\":$AFFECTED}" >> $GITHUB_OUTPUT
                  fi

    apply:
        name: Apply - ${{ matrix.name }}
        needs: detect-changes
        if: needs.detect-changes.outputs.has_changes == 'true'
        runs-on: ubuntu-latest
        environment: production
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # ── Azure Authentication ───────────────────────────────────────────
            - name: Azure Login
              if: matrix.cloud == 'azure'
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # ── AWS Authentication ─────────────────────────────────────────────
            - name: Configure AWS Credentials
              if: matrix.cloud == 'aws'
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  role-session-name: GitHubActions
                  aws-region: ${{ env.AWS_REGION }}

            - name: Assume Terraform Role
              if: matrix.cloud == 'aws'
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
                  role-session-name: Terraform
                  aws-region: ${{ env.AWS_REGION }}
                  role-chaining: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Terraform Init
              working-directory: ${{ matrix.path }}
              env:
                  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  ARM_USE_OIDC: true
                  ARM_USE_AZUREAD: true
              run: terraform init

            - name: Terraform Plan
              working-directory: ${{ matrix.path }}
              env:
                  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  ARM_USE_OIDC: true
                  ARM_USE_AZUREAD: true
              run: terraform plan -no-color -input=false -out=tfplan

            - name: Terraform Apply
              working-directory: ${{ matrix.path }}
              env:
                  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  ARM_USE_OIDC: true
                  ARM_USE_AZUREAD: true
              run: terraform apply -input=false tfplan

    no-changes:
        name: No CI-Enabled Modules
        needs: detect-changes
        if: needs.detect-changes.outputs.has_changes == 'false'
        runs-on: ubuntu-latest
        steps:
            - name: Report
              run: echo "No CI-enabled modules found"
